<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Architect Stack — 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07101f}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.drag{cursor:grabbing}
  canvas{display:block}
  .label{
    position:fixed;left:0;top:0;pointer-events:none;white-space:nowrap;
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    font-size:13px;font-weight:600;letter-spacing:.06em;
    padding:4px 10px;border-radius:3px;
    background:rgba(7,16,31,.55);border:1px solid currentColor;
    text-shadow:0 0 10px currentColor;transform:translate(-50%,-100%);
    will-change:transform;
  }
  .label.hub{font-size:14px;color:#e8f0ff;letter-spacing:.14em;text-transform:uppercase}
  #footer{
    position:fixed;left:16px;bottom:12px;pointer-events:none;
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    font-size:11px;letter-spacing:.08em;color:#3d6080;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="footer">Ramon Cortez · AI Architect</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07101f);
  scene.fog = new THREE.FogExp2(0x07101f, 0.012);

  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);

  // ---------- helpers ----------
  function glowTexture(hex){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const col = new THREE.Color(hex);
    const rgb = `${Math.round(col.r*255)},${Math.round(col.g*255)},${Math.round(col.b*255)}`;
    const g = x.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0, `rgba(${rgb},0.95)`);
    g.addColorStop(0.25, `rgba(${rgb},0.45)`);
    g.addColorStop(0.6, `rgba(${rgb},0.12)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = g; x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  function makeGlow(hex, size){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(hex), blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false
    }));
    s.scale.set(size, size, 1);
    return s;
  }

  // ---------- stars ----------
  (function(){
    const n = 900, pos = new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const r = 70 + Math.random()*140;
      const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(p)*Math.cos(t);
      pos[i*3+1] = r*Math.sin(p)*Math.sin(t);
      pos[i*3+2] = r*Math.cos(p);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color:0x7aa2d4, size:0.6, sizeAttenuation:true, transparent:true, opacity:.65, fog:false
    })));
  })();

  // ---------- ambient ----------
  scene.add(new THREE.AmbientLight(0x1a2a44, 0.8));

  // ---------- hub ----------
  const hub = new THREE.Group();
  const hubMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.7, 48, 48),
    new THREE.MeshStandardMaterial({
      color:0xdfe8f5, emissive:0xcfdcf0, emissiveIntensity:.9, metalness:.5, roughness:.25
    })
  );
  hub.add(hubMesh);
  hub.add(makeGlow(0xdfe8ff, 11));
  const hubLight = new THREE.PointLight(0xdfe8ff, 2.2, 60);
  hub.add(hubLight);
  scene.add(hub);

  // ---------- nodes ----------
  const NODES = [
    {name:'Claude',       color:0x38bdf8, css:'#38bdf8', r:6.5,  speed:.42, tilt:.25,  phase:0.0, size:.85},
    {name:'Relevance AI', color:0xf97316, css:'#f97316', r:9.0,  speed:.30, tilt:-.35, phase:1.7, size:.95},
    {name:'Gemini',       color:0xfacc15, css:'#facc15', r:11.5, speed:.22, tilt:.5,   phase:3.4, size:.8},
    {name:'NotebookLM',   color:0x4ade80, css:'#86efac', r:14.0, speed:.16, tilt:-.15, phase:5.0, size:.75},
  ];

  function orbitPoint(r, tilt, a, out){
    const x = r*Math.cos(a), z = r*Math.sin(a);
    out.set(x, -z*Math.sin(tilt), z*Math.cos(tilt));
    return out;
  }

  const labelsEl = [];
  function addLabel(text, css, cls){
    const d = document.createElement('div');
    d.className = 'label' + (cls ? ' '+cls : '');
    d.textContent = text;
    if(css) d.style.color = css;
    document.body.appendChild(d);
    return d;
  }
  const hubLabel = addLabel('AI Architect', null, 'hub');

  NODES.forEach(n=>{
    // orbit ring
    const pts = [], tmp = new THREE.Vector3();
    for(let i=0;i<=128;i++) pts.push(orbitPoint(n.r, n.tilt, i/128*Math.PI*2, new THREE.Vector3()));
    const ring = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:n.color, transparent:true, opacity:.12})
    );
    scene.add(ring);

    // sphere group
    const g = new THREE.Group();
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(n.size, 32, 32),
      new THREE.MeshStandardMaterial({
        color:n.color, emissive:n.color, emissiveIntensity:1.1, roughness:.35, metalness:.1
      })
    );
    g.add(mesh);
    g.add(makeGlow(n.color, n.size*7));
    g.add(new THREE.PointLight(n.color, 1.4, 22));
    scene.add(g);

    // connector line to hub
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),3));
    const line = new THREE.Line(lg, new THREE.LineBasicMaterial({
      color:n.color, transparent:true, opacity:.7, blending:THREE.AdditiveBlending
    }));
    scene.add(line);

    n.group = g; n.mesh = mesh; n.line = line;
    n.label = addLabel(n.name, n.css);
    n.angle = n.phase;
  });

  // ---------- camera orbit state ----------
  let theta = 0.6, phi = 1.15, radius = 30;
  let dragging = false, lastX = 0, lastY = 0, idleUntil = 0;
  const minR = 12, maxR = 70;

  function placeCamera(){
    camera.position.set(
      radius*Math.sin(phi)*Math.cos(theta),
      radius*Math.cos(phi),
      radius*Math.sin(phi)*Math.sin(theta)
    );
    camera.lookAt(0,0,0);
  }

  function down(x,y){ dragging = true; lastX = x; lastY = y; stage.classList.add('drag'); }
  function move(x,y){
    if(!dragging) return;
    theta -= (x-lastX)*0.006;
    phi = Math.min(Math.max(phi - (y-lastY)*0.006, 0.25), Math.PI-0.25);
    lastX = x; lastY = y;
    idleUntil = performance.now() + 2500;
  }
  function up(){ dragging = false; stage.classList.remove('drag'); idleUntil = performance.now() + 2500; }

  stage.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
  addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  addEventListener('mouseup', up);
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    radius = Math.min(Math.max(radius + e.deltaY*0.03, minR), maxR);
  }, {passive:false});

  stage.addEventListener('touchstart', e=>{ if(e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  stage.addEventListener('touchmove', e=>{ if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  stage.addEventListener('touchend', up);

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---------- labels ----------
  const v = new THREE.Vector3();
  function placeLabel(el, world, lift){
    v.copy(world); v.y += lift;
    v.project(camera);
    if(v.z > 1){ el.style.opacity = 0; return; }
    el.style.opacity = 1;
    const x = (v.x*0.5+0.5)*innerWidth, y = (-v.y*0.5+0.5)*innerHeight;
    el.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`;
  }

  // ---------- loop ----------
  const clock = new THREE.Clock();
  const tmp = new THREE.Vector3();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    if(!dragging && performance.now() > idleUntil) theta += dt*0.08;
    placeCamera();

    // hub pulse
    const hp = 1 + Math.sin(t*1.2)*0.04;
    hubMesh.scale.setScalar(hp);
    hubMesh.rotation.y += dt*0.2;

    NODES.forEach((n,i)=>{
      n.angle += dt*n.speed;
      orbitPoint(n.r, n.tilt, n.angle, tmp);
      n.group.position.copy(tmp);
      n.mesh.scale.setScalar(1 + Math.sin(t*1.6 + i*1.3)*0.12);

      const p = n.line.geometry.attributes.position;
      p.setXYZ(0, 0,0,0);
      p.setXYZ(1, tmp.x, tmp.y, tmp.z);
      p.needsUpdate = true;

      placeLabel(n.label, tmp, n.size + 1.1);
    });
    placeLabel(hubLabel, new THREE.Vector3(0,0,0), 2.7);

    renderer.render(scene, camera);
  }
  placeCamera();
  animate();
})();
</script>
</body>
</html>
