<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Architect Stack — 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02050d}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.drag{cursor:grabbing}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
  .corner{position:fixed;width:26px;height:26px;pointer-events:none;border:1px solid rgba(125,180,255,.35)}
  .corner.tl{left:14px;top:14px;border-right:none;border-bottom:none}
  .corner.tr{right:14px;top:14px;border-left:none;border-bottom:none}
  .corner.bl{left:14px;bottom:14px;border-right:none;border-top:none}
  .corner.br{right:14px;bottom:14px;border-left:none;border-top:none}
  .label{
    position:fixed;left:0;top:0;pointer-events:none;white-space:nowrap;
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    padding:5px 11px 5px 10px;
    background:linear-gradient(90deg,rgba(3,8,20,.72),rgba(3,8,20,.25));
    border-left:2px solid currentColor;
    text-shadow:0 0 12px currentColor;will-change:transform;
  }
  .label .nm{display:block;font-size:13px;font-weight:700;letter-spacing:.08em}
  .label .sb{display:block;font-size:8.5px;letter-spacing:.26em;opacity:.65;margin-top:2px}
  .label.hub{color:#e8f0ff}
  .label.hub .nm{font-size:14px;letter-spacing:.16em;text-transform:uppercase}
  #footer{
    position:fixed;left:30px;bottom:26px;pointer-events:none;
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    font-size:11px;letter-spacing:.1em;color:#4a6d92;
  }
  #hint{
    position:fixed;right:30px;bottom:26px;pointer-events:none;
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    font-size:9.5px;letter-spacing:.22em;color:#2d4a6b;text-transform:uppercase;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vig"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div id="footer">Ramon Cortez · AI Architect</div>
<div id="hint">Drag · Scroll</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02050d);

  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 900);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);

  // ---------- helpers ----------
  const rgbOf = hex => { const c = new THREE.Color(hex); return `${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)}`; };

  function glowTexture(hex){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'), rgb = rgbOf(hex);
    const g = x.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,   `rgba(${rgb},0.95)`);
    g.addColorStop(0.25,`rgba(${rgb},0.45)`);
    g.addColorStop(0.6, `rgba(${rgb},0.12)`);
    g.addColorStop(1,   `rgba(${rgb},0)`);
    x.fillStyle = g; x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  function makeGlow(hex, size, opacity){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(hex), blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false, opacity: opacity || 1
    }));
    s.scale.set(size, size, 1);
    return s;
  }
  function nebulaTexture(hexes){
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    for(let i=0;i<8;i++){
      const cx = 70+Math.random()*116, cy = 70+Math.random()*116, r = 45+Math.random()*55;
      const g = x.createRadialGradient(cx,cy,0,cx,cy,r);
      const rgb = rgbOf(hexes[i % hexes.length]);
      g.addColorStop(0,`rgba(${rgb},0.38)`); g.addColorStop(1,`rgba(${rgb},0)`);
      x.fillStyle = g; x.fillRect(0,0,256,256);
    }
    x.globalCompositeOperation = 'destination-in';
    const m = x.createRadialGradient(128,128,0,128,128,128);
    m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(0.7,'rgba(0,0,0,.6)'); m.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle = m; x.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  function randOnSphere(r){
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    return new THREE.Vector3(r*Math.sin(p)*Math.cos(t), r*Math.sin(p)*Math.sin(t), r*Math.cos(p));
  }

  // ---------- nebula clouds ----------
  const nebulaSets = [
    [0x4c1d95,0x1e3a8a,0x0e7490],
    [0x831843,0x4c1d95,0x1d4ed8],
    [0x0f766e,0x1e3a8a,0x6d28d9],
  ];
  const nebulae = [];
  for(let i=0;i<9;i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: nebulaTexture(nebulaSets[i%3]), blending: THREE.AdditiveBlending,
      transparent:true, depthWrite:false, opacity:.55, fog:false,
      rotation: Math.random()*Math.PI*2
    }));
    spr.position.copy(randOnSphere(130 + Math.random()*60));
    const s = 130 + Math.random()*110; spr.scale.set(s,s,1);
    scene.add(spr); nebulae.push(spr);
  }

  // ---------- star layers ----------
  function starLayer(n, rMin, rMax, size, opacity){
    const pos = new Float32Array(n*3), col = new Float32Array(n*3);
    const palette = [new THREE.Color(0xffffff), new THREE.Color(0xaecbff), new THREE.Color(0xffd9b0), new THREE.Color(0xc9b8ff)];
    for(let i=0;i<n;i++){
      const p = randOnSphere(rMin + Math.random()*(rMax-rMin));
      pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
      const c = palette[Math.floor(Math.random()*palette.length)];
      col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    const m = new THREE.PointsMaterial({size, vertexColors:true, transparent:true, opacity, sizeAttenuation:true, depthWrite:false, fog:false});
    const pts = new THREE.Points(g, m); scene.add(pts); return pts;
  }
  const starsA = starLayer(1800, 160, 420, 0.9, .75);
  const starsB = starLayer(260, 120, 300, 2.0, .9);

  // ---------- spiral galaxy ----------
  const galaxy = (function(){
    const N = 16000, pos = new Float32Array(N*3), col = new Float32Array(N*3);
    const inner = new THREE.Color(0xffb27a), mid = new THREE.Color(0xd16ba5), outer = new THREE.Color(0x5b8cff), tmp = new THREE.Color();
    for(let i=0;i<N;i++){
      const arm = i % 3;
      const rr = Math.pow(Math.random(), 0.75);
      const r = 24 + rr*80;
      const a = r*0.085 + arm*(Math.PI*2/3) + (Math.random()-.5)*0.55*(0.4+rr);
      const spread = (Math.random()-.5)*(2 + rr*6);
      pos[i*3]   = Math.cos(a)*r + (Math.random()-.5)*spread;
      pos[i*3+1] = (Math.random()-.5)*(1.5 + rr*5);
      pos[i*3+2] = Math.sin(a)*r + (Math.random()-.5)*spread;
      if(rr<.5) tmp.copy(inner).lerp(mid, rr*2); else tmp.copy(mid).lerp(outer, (rr-.5)*2);
      col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    const p = new THREE.Points(g, new THREE.PointsMaterial({
      size:.42, vertexColors:true, transparent:true, opacity:.8,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true, fog:false
    }));
    p.rotation.x = 0.42; p.rotation.z = -0.12;
    scene.add(p); return p;
  })();

  scene.add(new THREE.AmbientLight(0x1a2a44, 0.8));

  // ---------- hub ----------
  const hub = new THREE.Group();
  const hubMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.6, 48, 48),
    new THREE.MeshStandardMaterial({color:0xdfe8f5, emissive:0xcfdcf0, emissiveIntensity:.95, metalness:.5, roughness:.25})
  );
  hub.add(hubMesh);
  hub.add(makeGlow(0xdfe8ff, 12, .9));
  hub.add(makeGlow(0x6d8cff, 22, .35));
  const shell = new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.45, 1),
    new THREE.MeshBasicMaterial({color:0x9fc0ff, wireframe:true, transparent:true, opacity:.28, blending:THREE.AdditiveBlending, depthWrite:false})
  );
  hub.add(shell);
  const ringMat = c => new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:.55, blending:THREE.AdditiveBlending, depthWrite:false});
  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(3.3, 0.022, 8, 160), ringMat(0x9fd0ff));
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.9, 0.018, 8, 160), ringMat(0xc4b5fd));
  ring1.rotation.x = 1.2; ring2.rotation.x = 0.5; ring2.rotation.y = 0.9;
  hub.add(ring1); hub.add(ring2);
  hub.add(new THREE.PointLight(0xdfe8ff, 2.4, 70));
  scene.add(hub);

  // ---------- nodes ----------
  const NODES = [
    {name:'Claude',       sub:'REASONING', color:0x38bdf8, css:'#7dd3fc', r:6.5,  speed:.42, tilt:.25,  phase:0.0, size:.85},
    {name:'Relevance AI', sub:'AGENTS',    color:0xf97316, css:'#fdba74', r:9.0,  speed:.30, tilt:-.35, phase:1.7, size:.95},
    {name:'VS Code',      sub:'BUILD',     color:0xa78bfa, css:'#c4b5fd', r:11.5, speed:.22, tilt:.5,   phase:3.4, size:.8},
    {name:'NotebookLM',   sub:'RESEARCH',  color:0x4ade80, css:'#86efac', r:14.0, speed:.16, tilt:-.15, phase:5.0, size:.75},
  ];

  function orbitPoint(r, tilt, a, out){
    const x = r*Math.cos(a), z = r*Math.sin(a);
    out.set(x, -z*Math.sin(tilt), z*Math.cos(tilt));
    return out;
  }
  function addLabel(name, sub, css, cls){
    const d = document.createElement('div');
    d.className = 'label' + (cls ? ' '+cls : '');
    d.innerHTML = `<span class="nm">${name}</span><span class="sb">${sub}</span>`;
    if(css) d.style.color = css;
    document.body.appendChild(d);
    return d;
  }
  const hubLabel = addLabel('AI Architect', 'CORE', null, 'hub');

  const TRAIL = 70;
  NODES.forEach(n=>{
    const pts = [];
    for(let i=0;i<=160;i++) pts.push(orbitPoint(n.r, n.tilt, i/160*Math.PI*2, new THREE.Vector3()));
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:n.color, transparent:true, opacity:.14, blending:THREE.AdditiveBlending})
    ));

    const g = new THREE.Group();
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(n.size, 32, 32),
      new THREE.MeshStandardMaterial({color:n.color, emissive:n.color, emissiveIntensity:1.15, roughness:.35, metalness:.1})
    );
    g.add(mesh);
    g.add(makeGlow(n.color, n.size*7.5));
    g.add(makeGlow(n.color, n.size*14, .22));
    g.add(new THREE.PointLight(n.color, 1.5, 24));
    scene.add(g);

    // connector line
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),3));
    const line = new THREE.Line(lg, new THREE.LineBasicMaterial({color:n.color, transparent:true, opacity:.55, blending:THREE.AdditiveBlending}));
    line.frustumCulled = false;
    scene.add(line);

    // comet trail
    const tp = new Float32Array(TRAIL*3), tc = new Float32Array(TRAIL*3), base = new THREE.Color(n.color);
    for(let i=0;i<TRAIL;i++){
      const f = Math.pow(1 - i/TRAIL, 2.2);
      tc[i*3]=base.r*f; tc[i*3+1]=base.g*f; tc[i*3+2]=base.b*f;
    }
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.BufferAttribute(tp,3));
    tg.setAttribute('color', new THREE.BufferAttribute(tc,3));
    const trail = new THREE.Line(tg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
    trail.frustumCulled = false;
    scene.add(trail);

    // data pulses
    const pulses = [0, .5].map(off => {
      const s = makeGlow(0xffffff, 1.5, .95);
      s.material.color = new THREE.Color(n.color);
      scene.add(s); return {s, off};
    });

    n.group = g; n.mesh = mesh; n.line = line; n.trail = trail; n.tp = tp; n.pulses = pulses;
    n.label = addLabel(n.name, n.sub, n.css);
    n.angle = n.phase; n.init = false;
  });

  // ---------- shooting stars ----------
  const shooters = []; let nextShot = 2.5;
  function spawnShot(){
    const head = randOnSphere(90 + Math.random()*40);
    const rnd = randOnSphere(1);
    const vel = rnd.sub(head.clone().normalize().multiplyScalar(rnd.dot(head.clone().normalize()))).normalize().multiplyScalar(70 + Math.random()*40);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),3));
    const m = new THREE.LineBasicMaterial({color:0xcfe3ff, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false});
    const l = new THREE.Line(g, m); l.frustumCulled = false; scene.add(l);
    shooters.push({l, g, m, head, vel, life:1.3, max:1.3});
  }

  // ---------- camera orbit ----------
  let theta = 0.6, phi = 1.12, targetR = 30, radius = 75;
  let dragging = false, lastX = 0, lastY = 0, idleUntil = 0;
  function placeCamera(t){
    const ph = phi + Math.sin(t*0.22)*0.03;
    camera.position.set(
      radius*Math.sin(ph)*Math.cos(theta),
      radius*Math.cos(ph),
      radius*Math.sin(ph)*Math.sin(theta)
    );
    camera.lookAt(0,0,0);
  }
  function down(x,y){ dragging = true; lastX = x; lastY = y; stage.classList.add('drag'); }
  function move(x,y){
    if(!dragging) return;
    theta -= (x-lastX)*0.006;
    phi = Math.min(Math.max(phi - (y-lastY)*0.006, 0.25), Math.PI-0.25);
    lastX = x; lastY = y; idleUntil = performance.now() + 2500;
  }
  function up(){ dragging = false; stage.classList.remove('drag'); idleUntil = performance.now() + 2500; }
  stage.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
  addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  addEventListener('mouseup', up);
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    targetR = Math.min(Math.max(targetR + e.deltaY*0.03, 12), 80);
  }, {passive:false});
  stage.addEventListener('touchstart', e=>{ if(e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  stage.addEventListener('touchmove',  e=>{ if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  stage.addEventListener('touchend', up);
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---------- labels ----------
  const v = new THREE.Vector3();
  function placeLabel(el, world, lift){
    v.copy(world); v.y += lift; v.project(camera);
    if(v.z > 1){ el.style.opacity = 0; return; }
    el.style.opacity = 1;
    const x = (v.x*0.5+0.5)*innerWidth, y = (-v.y*0.5+0.5)*innerHeight;
    el.style.transform = `translate(${x}px,${y}px) translate(-12px,-100%)`;
  }

  // ---------- loop ----------
  const clock = new THREE.Clock();
  const tmp = new THREE.Vector3();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

    const intro = Math.max(0, 1 - t/3.5);
    radius += ((targetR + intro*intro*45) - radius) * Math.min(1, dt*6);
    if(!dragging && performance.now() > idleUntil) theta += dt*0.075;
    placeCamera(t);

    // background motion
    galaxy.rotation.y += dt*0.012;
    starsA.rotation.y += dt*0.0035;
    starsB.rotation.y -= dt*0.002;
    starsB.material.opacity = 0.65 + Math.sin(t*2.2)*0.25;
    nebulae.forEach((n,i)=>{ n.material.rotation += dt*0.004*(i%2?1:-1); });

    // hub
    hubMesh.scale.setScalar(1 + Math.sin(t*1.2)*0.04);
    hubMesh.rotation.y += dt*0.2;
    shell.rotation.y += dt*0.25; shell.rotation.x += dt*0.12;
    ring1.rotation.z += dt*0.5; ring2.rotation.z -= dt*0.35;

    // nodes
    NODES.forEach((n,i)=>{
      n.angle += dt*n.speed;
      orbitPoint(n.r, n.tilt, n.angle, tmp);
      n.group.position.copy(tmp);
      n.mesh.scale.setScalar(1 + Math.sin(t*1.6 + i*1.3)*0.12);

      const p = n.line.geometry.attributes.position;
      p.setXYZ(0,0,0,0); p.setXYZ(1,tmp.x,tmp.y,tmp.z); p.needsUpdate = true;

      // trail
      const tp = n.tp;
      if(!n.init){ for(let k=0;k<TRAIL;k++){ tp[k*3]=tmp.x; tp[k*3+1]=tmp.y; tp[k*3+2]=tmp.z; } n.init = true; }
      tp.copyWithin(3, 0, (TRAIL-1)*3);
      tp[0]=tmp.x; tp[1]=tmp.y; tp[2]=tmp.z;
      n.trail.geometry.attributes.position.needsUpdate = true;

      // pulses flow node -> hub
      n.pulses.forEach(pl=>{
        const u = (t*0.45 + pl.off + i*0.17) % 1;
        pl.s.position.copy(tmp).multiplyScalar(1-u);
        pl.s.material.opacity = Math.sin(Math.PI*u)*0.95;
      });

      placeLabel(n.label, tmp, n.size + 1.0);
    });
    placeLabel(hubLabel, new THREE.Vector3(0,0,0), 2.9);

    // shooting stars
    nextShot -= dt;
    if(nextShot <= 0){ spawnShot(); nextShot = 3 + Math.random()*5; }
    for(let i=shooters.length-1;i>=0;i--){
      const s = shooters[i];
      s.life -= dt;
      if(s.life <= 0){ scene.remove(s.l); s.g.dispose(); s.m.dispose(); shooters.splice(i,1); continue; }
      s.head.addScaledVector(s.vel, dt);
      const tail = s.head.clone().addScaledVector(s.vel.clone().normalize(), -9);
      const a = s.g.attributes.position;
      a.setXYZ(0, s.head.x, s.head.y, s.head.z); a.setXYZ(1, tail.x, tail.y, tail.z); a.needsUpdate = true;
      s.m.opacity = Math.max(0, s.life/s.max);
    }

    renderer.render(scene, camera);
  }
  placeCamera(0);
  animate();
})();
</script>
</body>
</html>
